name: 🌳 Plant Tree

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
    - cron: '43 6 * * *'
    - cron: '28 11 * * *'
    - cron: '52 15 * * *'
    - cron: '9 20 * * *'

jobs:
  plant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Update file & commit
        run: |
          node index.js > README.md
          git config user.name 'fineanmol'
          git config user.email 'anmol.agarwal2004@yahoo.com'
          # Allow pulling with local changes by stashing them automatically during rebase
          git pull --rebase --autostash
          git add README.md
          # Use a single-line node -e invocation for the generated commit message to avoid
          # problems with multiline quoting in the shell.
          git diff --cached --quiet || git commit -m "$(node -e 'const messages=["🌱 daily update","🔧 minor fix","📝 update log","✨ refresh","🌳 grow the tree","🚀 keep going","💡 small improvement","📦 routine update","🎯 stay consistent","🛠️ housekeeping","📈 one step at a time","🌿 green day","⚡ quick update","🔄 sync","💻 coding daily"];console.log(messages[Math.floor(Math.random()*messages.length)])')"
          git push
